name: Suggest an app
description: Add your go-to browser app to the catalogue.
title: 'App request: '
labels: []
body:
  - type: input
    id: name
    attributes:
      label: App name
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Official website
      placeholder: https://example.com
    validations:
      required: true
  - type: textarea
    id: icon
    attributes:
      label: Official icon source and brand guidance
      description: Share public URLs only. Do not upload personal data or copyrighted artwork without permission.
